name: dotnet-lint

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string
      dotnet_version:
        required: false
        type: string
        default: "10.0.x"
      generate_appsettings_script:
        required: false
        type: string
        default: ""
      verify_appsettings_not_tracked:
        required: false
        type: string
        default: "true"
      use_gmo_feed:
        required: false
        type: string
        default: "true"
      fail_on_vulnerable:
        required: false
        type: string
        default: "true"
    secrets:
      GH_USER:
        required: false
      GH_CLASSIC_PAT:
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: ${{ secrets.GH_USER }}
      GITHUB_PAT: ${{ secrets.GH_CLASSIC_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - name: Generate appsettings.json
        if: inputs.generate_appsettings_script != ''
        run: bash "${{ inputs.generate_appsettings_script }}"
      - name: Verify appsettings.json is not tracked
        if: inputs.verify_appsettings_not_tracked == 'true'
        run: |
          tracked=$(git ls-files '**/appsettings.json' '**/appsettings.*.json' 2>/dev/null | grep -v '\.template$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Do not commit appsettings.json or appsettings.*.json (use appsettings.json.template only):"
            echo "$tracked"
            exit 1
          fi
      - name: Configure NuGet auth for GMO feed
        if: inputs.use_gmo_feed == 'true'
        run: dotnet nuget update source GMO --username "$GITHUB_USERNAME" --password "$GITHUB_PAT" --store-password-in-clear-text
      - name: Restore
        run: dotnet restore "${{ inputs.solution_file }}" --verbosity normal
      - name: Audit NuGet packages for vulnerabilities
        env:
          SOLUTION_FILE: ${{ inputs.solution_file }}
          FAIL_ON_VULNERABLE: ${{ inputs.fail_on_vulnerable }}
        run: |
          dotnet list "$SOLUTION_FILE" package --vulnerable --include-transitive
          vulnerable="$(dotnet list "$SOLUTION_FILE" package --vulnerable --include-transitive --format json \
            | jq '[.. | objects | .vulnerabilities? // empty | .[]] | length')"
          if [ "$vulnerable" -gt 0 ]; then
            if [ "$FAIL_ON_VULNERABLE" = "true" ]; then
              echo "::error::Found ${vulnerable} known vulnerabilities in NuGet packages (see the list above). Upgrade the affected packages, or pin a patched transitive version in Directory.Packages.props."
              exit 1
            fi
            echo "::warning::Found ${vulnerable} known vulnerabilities in NuGet packages (fail_on_vulnerable is off)."
          fi
      - name: Verify format
        run: dotnet format "${{ inputs.solution_file }}" --verbosity diagnostic --verify-no-changes --no-restore
