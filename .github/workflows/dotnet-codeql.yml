name: dotnet-codeql

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string
      dotnet_version:
        required: false
        type: string
        default: "10.0.x"
      generate_appsettings_script:
        required: false
        type: string
        default: ""
      appsettings_template:
        required: false
        type: string
        default: ""
        description: "appsettings template (path ending in .template). When set, DevOps dotnet/ci/generate-appsettings.sh renders it next to itself instead of running generate_appsettings_script."
      appsettings_defaults:
        required: false
        type: string
        default: ""
        description: "Optional KEY=VALUE defaults file passed to the generic generator with appsettings_template."
      devops_ref:
        required: false
        type: string
        default: "main"
        description: "Ref of gideonogegaorg/DevOps checked out when appsettings_template is set."
      # Repo script run with bash after setup-dotnet, before build (e.g. install mono-complete for net48).
      pre_build_script:
        required: false
        type: string
        default: ""
      use_gmo_feed:
        required: false
        type: string
        default: "true"
      languages:
        required: false
        type: string
        default: csharp
      queries:
        required: false
        type: string
        default: security-extended
      # Private repos without GitHub Code Security should pass "false" (analyze still runs; Actions check is the gate).
      upload_results:
        required: false
        type: string
        default: "true"
    secrets:
      GH_USER:
        required: false
      GH_CLASSIC_PAT:
        required: false

jobs:
  CodeQL:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      GITHUB_USERNAME: ${{ secrets.GH_USER }}
      GITHUB_PAT: ${{ secrets.GH_CLASSIC_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ inputs.languages }}
          queries: ${{ inputs.queries }}

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Checkout DevOps scripts
        if: inputs.appsettings_template != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gideonogegaorg/DevOps
          ref: ${{ inputs.devops_ref }}
          path: DevOps
          persist-credentials: false
      - name: Generate appsettings.json
        if: inputs.generate_appsettings_script != '' && inputs.appsettings_template == ''
        run: bash "${{ inputs.generate_appsettings_script }}"
      - name: Generate appsettings.json from template
        if: inputs.appsettings_template != ''
        env:
          APPSETTINGS_TEMPLATE: ${{ inputs.appsettings_template }}
          APPSETTINGS_DEFAULTS: ${{ inputs.appsettings_defaults }}
        run: |
          if [[ "$APPSETTINGS_TEMPLATE" != *.template ]]; then
            echo "::error::appsettings_template must end in .template."
            exit 1
          fi
          bash DevOps/dotnet/ci/generate-appsettings.sh "$APPSETTINGS_TEMPLATE" "${APPSETTINGS_TEMPLATE%.template}" ${APPSETTINGS_DEFAULTS:+"$APPSETTINGS_DEFAULTS"}
          rm -rf DevOps

      - name: Run pre-build script
        if: inputs.pre_build_script != ''
        run: bash "${{ inputs.pre_build_script }}"

      - name: Configure NuGet auth for GMO feed
        if: inputs.use_gmo_feed == 'true'
        run: dotnet nuget update source GMO --username "$GITHUB_USERNAME" --password "$GITHUB_PAT" --store-password-in-clear-text

      - name: Build for CodeQL
        run: |
          dotnet restore "${{ inputs.solution_file }}"
          dotnet build "${{ inputs.solution_file }}" --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ inputs.languages }}"
          upload: ${{ inputs.upload_results == 'true' && 'always' || 'never' }}
