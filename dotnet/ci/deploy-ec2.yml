# dotnet deploy to EC2 template (reference)
# Implemented in .github/workflows/dotnet-deploy-ec2.yml

inputs:
  csproj_publish:
    required: true
  app_name:
    required: true
  photos_app_name:
    default: ""
  generate_appsettings_script:
    default: "scripts/generate-appsettings.sh"
  generate_robots_script:
    default: "scripts/generate-robots.sh"
  configure_service_script:
    default: "scripts/configure-service.sh"
  install_runtime_script:
    default: "scripts/install-aspnetcore-runtime.sh"
  setup_paths_filter:
    default: "scripts/configure-service.sh"
  assembly_version:
    required: true
  dll_version:
    required: true
  setup_changed:
    default: "no"
  deploy_path:
    required: true
  full_hostname:
    required: true
  port:
    required: true
  service_name:
    required: true
  cert_domain:
    required: true
  is_production:
    default: "development"
  require_postgres:
    default: "yes"
  extra_deploy_dirs:
    default: "uploads"
  remote_deploy_script:
    default: ""
  ssh_host:
    default: ""
  appsettings_env:
    default: ""
  appsettings_secret_names:
    default: ""
  ensure_redis:
    default: "no"
  devops_ref:
    default: "main"
  dll_name:
    default: ""
  restrict_appsettings:
    default: "no"
  use_gmo_feed:
    default: "false"
  appsettings_template:
    default: ""
  appsettings_defaults:
    default: ""
  robots_path:
    default: ""
  health_path:
    default: "/"
  support_contact:
    default: ""

outputs:
  support_contact: {}
