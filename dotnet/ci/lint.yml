# dotnet lint + audit template (reference)
# Implemented in .github/workflows/dotnet-lint.yml
#
# Steps: checkout, setup dotnet, optional appsettings gen (app script or DevOps generate-appsettings.sh), nuget auth,
#        restore, vulnerable package audit, dotnet format verify

inputs:
  solution_file:
    required: true
  dotnet_version:
    default: "10.0.x"
  generate_appsettings_script:
    default: ""
  verify_appsettings_not_tracked:
    default: "true"
  fail_on_vulnerable:
    default: "true"
  appsettings_template:
    default: ""
  appsettings_defaults:
    default: ""
  devops_ref:
    default: "main"
